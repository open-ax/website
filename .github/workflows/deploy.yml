name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check credentials
        if: ${{ !env.SITE_URL || !secrets.CLOUDFLARE_API_TOKEN || !secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::error::Missing configuration. Add under Settings > Secrets and variables > Actions:"
          echo "  Variable  SITE_URL                (e.g. https://openax.pages.dev)"
          echo "  Secret    CLOUDFLARE_API_TOKEN   (Workers Scripts: Edit, Account Settings: Read)"
          echo "  Secret    CLOUDFLARE_ACCOUNT_ID"
          exit 1

      - name: Build and verify
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --commit-hash=${{ github.sha }} --commit-message=${{ github.event.head_commit.message }} --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify IndexNow
        run: node scripts/indexnow.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
